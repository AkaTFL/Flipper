apiVersion: apps/v1
kind: Deployment
metadata:
  name: backglass-deployment
  namespace: playfield
  labels:
    app: backglass
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backglass
  template:
    metadata:
      labels:
        app: backglass
    spec:
      containers:
        - name: backglass
          image: docker.io/hounga/playfield-backglass:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backglass-service
  namespace: playfield
spec:
  selector:
    app: backglass
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 30082
  type: NodePort
