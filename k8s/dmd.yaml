apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmd-deployment
  namespace: playfield
  labels:
    app: dmd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dmd
  template:
    metadata:
      labels:
        app: dmd
    spec:
      containers:
        - name: dmd
          image: docker.io/hounga/playfield-dmd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dmd-service
  namespace: playfield
spec:
  selector:
    app: dmd
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 30081
  type: NodePort