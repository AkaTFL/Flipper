server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    location /ws {
        set $backend backend;
        proxy_pass http://$backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location = /events {
        set $bridge bridge;
        proxy_pass http://$bridge:8091/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /state {
        set $bridge bridge;
        proxy_pass http://$bridge:8091/state;
        proxy_connect_timeout 2s;
    }

    location /flipper/ {
        try_files $uri $uri/ /flipper/index.html;
    }

    location /backglass/ {
        try_files $uri $uri/ /backglass/index.html;
    }

    location /dmd/ {
        try_files $uri $uri/ /dmd/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
