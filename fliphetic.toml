[app]
id          = "akatfl-flipper"
name        = "Flipper AkaTFL"
authors     = ["AkaTFL"]
description = "Flipper virtuel avec Flipper, Backglass, DMD et contrôleur ESP32."

[deploy]
strategy = "branch"
ref      = "develop"

[screens]
flipper = { service = "app", port = 80, path = "/flipper/?cabinet=1" }
backglass = { service = "app", port = 80, path = "/backglass/" }
dmd       = { service = "app", port = 80, path = "/dmd/" }

[compose]
file = "deploy/docker-compose.yml"
ready_timeout = 60

[esp32.esp32]
firmware   = "firmware/build/firmware.bin"
chip       = "esp32"
flash_addr = "0x0"
baud       = 115200
required   = false
