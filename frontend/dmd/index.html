<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMD</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #dmd {
        position: fixed;
        bottom: 30px; /* distance du bas de l'écran */
        left: 50%;
        transform: translateX(-50%);

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px; /* espace entre combo et quêtes */

        width: 100%;
        pointer-events: none;
      }

      #combo {
        color: #1948e4;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        font-size: 20px;
        margin-bottom: 25px;
      }

      #quests {
        color: #a10b0b;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        font-size: 18px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div id="dmd">
      <div id="combo"></div>
      <div id="quests"></div>
    </div>
    <script type="module">
      import { DmdDisplay } from './DmdDisplay.js';
      const dmdDisplay = new DmdDisplay();
    </script>
  </body>
</html>
