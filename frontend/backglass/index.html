<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backglass</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #backglass {
        position: fixed;
        bottom: 30px; /* distance du bas de l'écran */
        left: 50%;
        transform: translateX(-50%);

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px; /* espace entre combo et quêtes */

        width: 100%;
        pointer-events: none;
      }

      #combo {
        color: #1948e4;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        font-size: 20px;
        margin-bottom: 25px;
      }

      #quests {
        color: #a10b0b;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        font-size: 18px;
        margin-bottom: 20px;
      }

      #buttons-monitor {
        position: fixed;
        top: 24px;
        left: 24px;
        min-width: 360px;
        padding: 16px;
        border: 2px solid #34f28b;
        background: rgba(0, 12, 8, 0.88);
        color: #75ffb0;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        line-height: 1.45;
        white-space: pre;
        box-shadow: 0 0 18px rgba(52, 242, 139, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="backglass">
      <div id="combo"></div>
      <div id="quests"></div>
    </div>
    <div id="buttons-monitor"></div>
    <script type="module">
      import { BackglassDisplay } from './BackglassDisplay.js';
      const backglassDisplay = new BackglassDisplay();
    </script>
  </body>
</html>
