<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backglass - Original Display</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        font-family: 'Courier New', monospace;
      }

      #backglass {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 40px 20px;
        pointer-events: none;
      }

      /* === SECTION SUPÉRIEURE: JOUEURS ET CRÉDITS === */
      .indicators-top {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        max-width: 1000px;
      }

      .player-indicator {
        text-align: center;
        padding: 15px;
        border: 2px solid #333;
        border-radius: 8px;
        background: rgba(20, 20, 30, 0.8);
        transition: all 0.3s ease;
      }

      .player-indicator.active {
        background: rgba(255, 215, 0, 0.1);
        border-color: #ffd700;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.4),
                    inset 0 0 15px rgba(255, 215, 0, 0.1);
      }

      .player-light {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin: 0 auto 8px;
        background: #333;
        box-shadow: 0 0 4px rgba(0,0,0,0.8);
        transition: all 0.3s ease;
      }

      .player-indicator.active .player-light {
        background: #ffd700;
        box-shadow: 0 0 12px #ffd700, inset 0 0 8px rgba(255, 255, 100, 0.3);
        animation: pulse-light 0.8s ease-in-out infinite;
      }

      .player-label {
        color: #888;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: color 0.3s ease;
      }

      .player-indicator.active .player-label {
        color: #ffd700;
      }

      .score-display {
        color: #0f0;
        font-size: 18px;
        font-weight: bold;
        margin-top: 8px;
        text-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
      }

      /* === SECTION CRÉDITS === */
      .credits-section {
        text-align: center;
        padding: 20px 40px;
        background: rgba(10, 100, 150, 0.15);
        border: 2px solid #0099cc;
        border-radius: 12px;
        box-shadow: inset 0 0 20px rgba(0, 153, 204, 0.2);
        margin: 20px 0;
      }

      .credits-label {
        color: #0099cc;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: bold;
      }

      .credits-value {
        color: #00ff99;
        font-size: 36px;
        font-weight: bold;
        margin-top: 8px;
        text-shadow: 0 0 10px rgba(0, 255, 153, 0.6);
      }

      /* === SECTION CENTRE: ANIMATIONS MÉCANIQUES === */
      .animation-wheel {
        position: relative;
        width: 200px;
        height: 200px;
        margin: 30px 0;
      }

      .wheel-outer {
        position: absolute;
        inset: 0;
        border: 4px solid #ff6b6b;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          #ff6b6b 0deg,
          #ff1744 45deg,
          #ffd700 90deg,
          #00ff88 135deg,
          #00ccff 180deg,
          #9d4edd 225deg,
          #ff6b6b 360deg
        );
        animation: spin-wheel 4s linear infinite;
        box-shadow: 0 0 30px rgba(255, 107, 107, 0.4),
                    inset 0 0 20px rgba(0, 0, 0, 0.5);
      }

      .wheel-inner {
        position: absolute;
        inset: 25px;
        background: radial-gradient(circle, #333 0%, #111 100%);
        border-radius: 50%;
        border: 2px solid #555;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        color: #ffd700;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
      }

      .wheel-needle {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 15px solid #ffd700;
        filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.8));
      }

      /* === SECTION INFÉRIEURE: STATUS ET QUÊTES === */
      .status-section {
        text-align: center;
        width: 100%;
        max-width: 800px;
      }

      .game-status {
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 24px;
        font-weight: bold;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .game-status.gameover {
        background: rgba(255, 0, 0, 0.15);
        border: 2px solid #ff0000;
        color: #ff0000;
        text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        animation: blink-gameover 0.5s ease-in-out infinite;
      }

      .game-status.match {
        background: rgba(0, 255, 0, 0.15);
        border: 2px solid #00ff00;
        color: #00ff00;
        text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
        animation: blink-match 0.6s ease-in-out infinite;
      }

      .game-status.normal {
        background: transparent;
        border: none;
        color: #888;
      }

      #combo {
        color: #1948e4;
        font-size: 18px;
        margin-bottom: 15px;
        text-shadow: 0 0 8px rgba(25, 72, 228, 0.4);
      }

      #quests {
        color: #a10b0b;
        font-size: 16px;
        margin-top: 15px;
        line-height: 1.6;
        text-shadow: 0 0 8px rgba(161, 11, 11, 0.4);
      }

      /* === ANIMATIONS === */
      @keyframes pulse-light {
        0%, 100% {
          box-shadow: 0 0 12px #ffd700, inset 0 0 8px rgba(255, 255, 100, 0.3);
        }
        50% {
          box-shadow: 0 0 20px #ffd700, inset 0 0 12px rgba(255, 255, 100, 0.5);
        }
      }

      @keyframes spin-wheel {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes blink-gameover {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      @keyframes blink-match {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
        75% { opacity: 1; }
      }

      /* === SECTION BOSS === */
      .boss-container {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.95) 100%);
        backdrop-filter: blur(4px);
        z-index: 100;
        pointer-events: none;
      }

      .boss-container.active {
        display: flex;
        animation: boss-entrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes boss-entrance {
        0% {
          opacity: 0;
          transform: scale(0.3) translateY(100px);
          filter: blur(20px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0);
        }
      }

      .boss-container.defeated {
        animation: boss-defeat 1s ease-out forwards;
      }

      @keyframes boss-defeat {
        0% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
        50% {
          transform: scale(1.1) rotate(-5deg);
          opacity: 1;
        }
        100% {
          transform: scale(0) rotate(-360deg) translateY(200px);
          opacity: 0;
        }
      }

      .boss-visualization {
        position: relative;
        width: 300px;
        height: 400px;
        margin-bottom: 40px;
      }

      .boss-visualization.critical .boss-body {
        animation: boss-pulse 0.5s ease-in-out infinite;
      }

      .boss-visualization.critical .flame {
        filter: blur(4px);
      }

      /* Boss body - silhouette de feu */
      .boss-body {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, #ff6600 0%, #ff2200 30%, #330000 100%);
        clip-path: polygon(
          50% 0%, 100% 25%, 95% 45%, 100% 65%, 75% 85%, 50% 95%, 25% 85%, 0% 65%, 5% 45%, 0% 25%
        );
        box-shadow: 
          0 0 40px rgba(255, 102, 0, 0.8),
          0 0 80px rgba(255, 34, 0, 0.6),
          inset -20px -20px 60px rgba(0, 0, 0, 0.5),
          inset 20px 20px 60px rgba(255, 200, 0, 0.3);
        animation: boss-pulse 1.2s ease-in-out infinite;
      }

      /* Eyes du boss */
      .boss-eyes {
        position: absolute;
        top: 35%;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        display: flex;
        justify-content: space-between;
        z-index: 10;
      }

      .boss-eye {
        width: 40px;
        height: 50px;
        background: radial-gradient(ellipse at center, #ffff00 0%, #ff8800 50%, #330000 100%);
        border-radius: 50%;
        box-shadow: 
          0 0 20px rgba(255, 255, 0, 0.9),
          inset -8px -8px 15px rgba(0, 0, 0, 0.6);
        animation: boss-eye-glow 0.6s ease-in-out infinite;
      }

      .boss-eye:nth-child(2) {
        animation-delay: 0.3s;
      }

      /* Flames autour du boss */
      .boss-flames {
        position: absolute;
        inset: -30px;
        overflow: hidden;
      }

      .flame {
        position: absolute;
        background: radial-gradient(ellipse at center, #ffff00, #ff6600, transparent);
        border-radius: 50% 50% 50% 0;
        transform-origin: bottom center;
        opacity: 0.7;
        filter: blur(8px);
      }

      .flame:nth-child(1) {
        width: 60px;
        height: 80px;
        left: 10%;
        bottom: -20px;
        animation: flame-flicker 1.5s ease-in-out infinite;
      }

      .flame:nth-child(2) {
        width: 80px;
        height: 100px;
        right: 5%;
        bottom: -30px;
        animation: flame-flicker 1.8s ease-in-out infinite 0.3s;
      }

      .flame:nth-child(3) {
        width: 70px;
        height: 90px;
        left: 30%;
        bottom: -40px;
        animation: flame-flicker 1.6s ease-in-out infinite 0.6s;
      }

      .flame:nth-child(4) {
        width: 75px;
        height: 95px;
        right: 25%;
        bottom: -35px;
        animation: flame-flicker 1.7s ease-in-out infinite 0.9s;
      }

      /* Boss health bar */
      .boss-health-section {
        width: 100%;
        max-width: 500px;
        margin-top: 40px;
      }

      .boss-title {
        text-align: center;
        color: #ff6600;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 15px;
        text-shadow: 0 0 20px rgba(255, 102, 0, 0.8),
                     0 0 40px rgba(255, 34, 0, 0.5);
        letter-spacing: 2px;
      }

      .boss-level {
        text-align: center;
        color: #ffff00;
        font-size: 14px;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .health-bar-container {
        width: 100%;
        height: 40px;
        background: rgba(0, 0, 0, 0.8);
        border: 3px solid #ff6600;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(255, 102, 0, 0.5),
                    inset 0 0 10px rgba(0, 0, 0, 0.8);
      }

      .health-bar {
        height: 100%;
        background: linear-gradient(90deg, #ff2200 0%, #ff6600 50%, #ffaa00 100%);
        width: 100%;
        transition: width 0.4s ease;
        box-shadow: 0 0 15px rgba(255, 102, 0, 0.8),
                    inset 0 0 8px rgba(255, 200, 0, 0.3);
        position: relative;
      }

      .health-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
        animation: health-shimmer 1.5s ease-in-out infinite;
      }

      .health-text {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 14px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }

      .damage-indicator {
        text-align: center;
        color: #ffff00;
        font-size: 18px;
        margin-top: 15px;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(255, 255, 0, 0.6);
      }

      .boss-defeated-text {
        position: absolute;
        font-size: 48px;
        font-weight: bold;
        color: #00ff00;
        text-shadow: 0 0 30px rgba(0, 255, 0, 0.8),
                     0 0 60px rgba(0, 255, 0, 0.5);
        opacity: 0;
        animation: victory-burst 1.2s ease-out forwards;
        pointer-events: none;
      }

      @keyframes victory-burst {
        0% {
          opacity: 0;
          transform: scale(0) rotate(-180deg);
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(1.5) rotate(0deg) translateY(-100px);
        }
      }

      /* === ANIMATIONS === */
      @keyframes boss-pulse {
        0%, 100% {
          box-shadow: 
            0 0 40px rgba(255, 102, 0, 0.8),
            0 0 80px rgba(255, 34, 0, 0.6),
            inset -20px -20px 60px rgba(0, 0, 0, 0.5),
            inset 20px 20px 60px rgba(255, 200, 0, 0.3);
          transform: scale(1);
        }
        50% {
          box-shadow: 
            0 0 60px rgba(255, 102, 0, 0.9),
            0 0 120px rgba(255, 34, 0, 0.7),
            inset -20px -20px 60px rgba(0, 0, 0, 0.5),
            inset 20px 20px 60px rgba(255, 200, 0, 0.4);
          transform: scale(1.05);
        }
      }

      @keyframes boss-eye-glow {
        0%, 100% {
          box-shadow: 
            0 0 20px rgba(255, 255, 0, 0.9),
            inset -8px -8px 15px rgba(0, 0, 0, 0.6);
        }
        50% {
          box-shadow: 
            0 0 40px rgba(255, 255, 0, 1),
            inset -8px -8px 15px rgba(0, 0, 0, 0.4);
        }
      }

      @keyframes flame-flicker {
        0%, 100% { transform: rotate(0deg) translateY(0) scaleY(1); opacity: 0.7; }
        25% { transform: rotate(-8deg) translateY(-10px) scaleY(1.1); opacity: 0.9; }
        50% { transform: rotate(4deg) translateY(0) scaleY(0.95); opacity: 0.6; }
        75% { transform: rotate(-6deg) translateY(-5px) scaleY(1.05); opacity: 0.8; }
      }

      @keyframes health-shimmer {
        0%, 100% { opacity: 0; }
        50% { opacity: 0.5; }
      }

      /* === RESPONSIVE === */
      @media (max-width: 768px) {
        .indicators-top {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }

        .animation-wheel {
          width: 150px;
          height: 150px;
        }

        .credits-value {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div id="backglass">
      <!-- Indicateurs joueurs et crédits en haut -->
      <div class="indicators-top">
        <div class="player-indicator" data-player="1">
          <div class="player-light"></div>
          <div class="player-label">Player 1</div>
          <div class="score-display">0</div>
        </div>
        <div class="player-indicator" data-player="2">
          <div class="player-light"></div>
          <div class="player-label">Player 2</div>
          <div class="score-display">0</div>
        </div>
        <div class="player-indicator" data-player="3">
          <div class="player-light"></div>
          <div class="player-label">Player 3</div>
          <div class="score-display">0</div>
        </div>
        <div class="player-indicator" data-player="4">
          <div class="player-light"></div>
          <div class="player-label">Player 4</div>
          <div class="score-display">0</div>
        </div>
      </div>

      <!-- Crédits -->
      <div class="credits-section">
        <div class="credits-label">Crédits Restants</div>
        <div class="credits-value">--</div>
      </div>

      <!-- Animation mécanique au centre -->
      <div class="animation-wheel">
        <div class="wheel-outer">
          <div class="wheel-inner">🎯</div>
        </div>
        <div class="wheel-needle"></div>
      </div>

      <!-- Status et quêtes en bas -->
      <div class="status-section">
        <div class="game-status normal">-- EN ATTENTE --</div>
        <div id="combo"></div>
        <div id="quests"></div>
      </div>
    </div>

    <!-- SECTION BOSS SPECTACULAIRE -->
    <div class="boss-container">
      <div class="boss-visualization">
        <div class="boss-body">
          <div class="boss-eyes">
            <div class="boss-eye"></div>
            <div class="boss-eye"></div>
          </div>
        </div>
        <div class="boss-flames">
          <div class="flame"></div>
          <div class="flame"></div>
          <div class="flame"></div>
          <div class="flame"></div>
        </div>
      </div>

      <div class="boss-health-section">
        <div class="boss-title">⚔️ BOSS ⚔️</div>
        <div class="boss-level">Level <span id="boss-level">1</span></div>
        <div class="health-bar-container">
          <div class="health-bar" id="boss-health-bar">
            <div class="health-text" id="boss-health-text">1500 / 1500</div>
          </div>
        </div>
        <div class="damage-indicator" id="boss-damage-text">Dégâts infligés: 0</div>
        <div class="boss-defeated-text">🎉 VICTOIRE! 🎉</div>
      </div>
    </div>

    <script type="module">
      import { BackglassDisplay } from './BackglassDisplay.js';
      const backglassDisplay = new BackglassDisplay();
    </script>
  </body>
</html>
