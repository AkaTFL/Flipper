<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backglass</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at center, rgba(30, 44, 92, 0.18) 0%, rgba(0, 0, 0, 0) 42%),
          linear-gradient(180deg, #05070c 0%, #000 100%);
      }
      #backglass {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #score {
        width: 100%;
        text-align: center;
        color: #f8ff6a;
        font-family: 'Courier New', Courier, monospace;
        font-weight: 900;
        font-size: min(32vw, 36vh);
        line-height: 0.88;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: 0 0 0 #000, 0 0 12px rgba(248, 255, 106, 0.35), 4px 4px 0 #000;
        -webkit-font-smoothing: none;
        font-smooth: never;
        transform: translateY(-1vh) scale(1.02);
        filter: contrast(1.15) saturate(1.05);
        image-rendering: pixelated;
        user-select: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }

      #score::before {
        content: 'SCORE';
        display: block;
        text-align: center;
        font-size: 0.16em;
        letter-spacing: 0.35em;
        margin-bottom: 0.2em;
        color: rgba(248, 255, 106, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="backglass">
      <div id="score">0</div>
    </div>
    <script type="module">
      import { DmdDisplay } from './DmdDisplay.js';
      const dmdDisplay = new DmdDisplay();
    </script>
  </body>
</html>
