<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipper</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      #three {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #play-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
        z-index: 10;
      }

      #play-button {
        pointer-events: auto;
        margin-bottom: 18px;
        width: 54px;
        height: 54px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        color: #111;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        display: grid;
        place-items: center;
        font-size: 18px;
        line-height: 1;
      }

      #play-button:hover {
        transform: scale(1.04);
      }

      #play-button:active {
        transform: scale(0.98);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/rapier.mjs",
          "three": "https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.module.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/controls/OrbitControls.js",
          "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/loaders/GLTFLoader.js",
          "three/examples/jsm/postprocessing/EffectComposer.js": "https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/postprocessing/EffectComposer.js",
          "three/examples/jsm/postprocessing/RenderPass.js": "https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/postprocessing/RenderPass.js",
          "three/examples/jsm/postprocessing/ShaderPass.js": "https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/postprocessing/ShaderPass.js",
          "three/examples/jsm/shaders/FXAAShader.js": "https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/shaders/FXAAShader.js"
        }
      }
    </script>
  </head>
  <body id="three">
    <div id="play-overlay" aria-hidden="false">
      <button id="play-button" type="button" aria-label="Lancer le flipper">▶</button>
    </div>
    <script type="module">
      const playButton = document.getElementById('play-button');
      const playOverlay = document.getElementById('play-overlay');

      playButton.addEventListener('click', async () => {
        playButton.disabled = true;
        playButton.textContent = '…';

        const { initFlipper } = await import('./core/Flipper.js');
        await initFlipper();

        playOverlay?.remove();
      }, { once: true });
    </script>
  </body>
</html>
