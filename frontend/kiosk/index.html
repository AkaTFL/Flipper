<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipper</title>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <script>
      const screen = new URLSearchParams(window.location.search).get('screen');
      const routes = {
        flipper: 'http://localhost:3001',
        backglass: 'http://localhost:3002',
        dmd: 'http://localhost:3003'
      };

      if (routes[screen]) {
        window.location.replace(routes[screen]);
      } else {
        document.body.textContent = 'Écran inconnu';
      }
    </script>
  </body>
</html>
