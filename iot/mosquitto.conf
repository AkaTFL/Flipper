# Mosquitto — environnement développement / tests sans matériel
# Référence : https://mosquitto.org/man/mosquitto-conf-5.html

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Limite messages volumineux (JSON capteurs / solénoïdes)
message_size_limit 1048576

connection_messages true
