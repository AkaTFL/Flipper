name: CD - Deploy to Kubernetes

on:
  push:
    branches: ["main"] # On ne déploie que ce qui arrive sur main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 1. Connexion au registre d'images (GitHub Container Registry)


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Build et Push de l'image Backend


      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      # 3. Build et Push de l'image Frontend


      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      # 4. Configuration de l'accès au Cluster K8s


      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}


      # 5. Déploiement sur le cluster
      - name: Deploy to Cluster
        run: |
          # Applique tous les fichiers de configuration du dossier k8s
          kubectl apply -f k8s/
          
          # Force la mise à jour des pods avec les nouvelles images
          kubectl rollout restart deployment/backend-deployment
          kubectl rollout restart deployment/frontend-deployment