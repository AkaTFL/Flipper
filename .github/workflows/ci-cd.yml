name: CI/CD Build & Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute owner lowercase
        run: |
          echo "OWNER_LOWER=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push backend
        run: |
          docker build -t flipper-backend:tmp ./backend
          IMAGE=docker.io/${OWNER_LOWER}/flipper-backend:${GITHUB_SHA}
          docker tag flipper-backend:tmp $IMAGE
          docker push $IMAGE

      - name: Build and push frontend
        run: |
          docker build -t flipper-frontend:tmp ./frontend/flipper
          IMAGE=docker.io/${OWNER_LOWER}/flipper-frontend:${GITHUB_SHA}
          docker tag flipper-frontend:tmp $IMAGE
          docker push $IMAGE

      - name: Build and push iot
        run: |
          docker build -t flipper-iot:tmp ./iot
          IMAGE=docker.io/${OWNER_LOWER}/flipper-iot:${GITHUB_SHA}
          docker tag flipper-iot:tmp $IMAGE
          docker push $IMAGE

      - name: Build and push dmd
        run: |
          docker build -t flipper-dmd:tmp ./frontend/dmd
          IMAGE=docker.io/${OWNER_LOWER}/flipper-dmd:${GITHUB_SHA}
          docker tag flipper-dmd:tmp $IMAGE
          docker push $IMAGE

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG secret not provided - skipping deploy job"
            exit 0
          fi
          echo "$KUBE_CONFIG_DATA" | base64 --decode > kubeconfig
          mkdir -p $HOME/.kube
          mv kubeconfig $HOME/.kube/config

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.1.0/kustomize_v5.1.0_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Compute owner lowercase for deploy
        run: |
          echo "OWNER_LOWER=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Update kustomize images
        run: |
          cd k8s || exit 1
          BACKEND_IMAGE=docker.io/${OWNER_LOWER}/flipper-backend:${GITHUB_SHA}
          FRONTEND_IMAGE=docker.io/${OWNER_LOWER}/flipper-frontend:${GITHUB_SHA}
          IOT_IMAGE=docker.io/${OWNER_LOWER}/flipper-iot:${GITHUB_SHA}
          DMD_IMAGE=docker.io/${OWNER_LOWER}/flipper-dmd:${GITHUB_SHA}
          kustomize edit set image flipper-backend=$BACKEND_IMAGE || true
          kustomize edit set image flipper-frontend=$FRONTEND_IMAGE || true
          kustomize edit set image flipper-iot=$IOT_IMAGE || true
          kustomize edit set image flipper-dmd=$DMD_IMAGE || true

      - name: Set images and deploy via kubectl
        run: |
          BACKEND_IMAGE=docker.io/${OWNER_LOWER}/flipper-backend:${GITHUB_SHA}
          FRONTEND_IMAGE=docker.io/${OWNER_LOWER}/flipper-frontend:${GITHUB_SHA}
          IOT_IMAGE=docker.io/${OWNER_LOWER}/flipper-iot:${GITHUB_SHA}
          DMD_IMAGE=docker.io/${OWNER_LOWER}/flipper-dmd:${GITHUB_SHA}
          kubectl -n flipper set image deployment/backend-deployment backend=$BACKEND_IMAGE || true
          kubectl -n flipper set image deployment/frontend-deployment frontend=$FRONTEND_IMAGE || true
          kubectl -n flipper set image deployment/iot-deployment iot=$IOT_IMAGE || true
          kubectl -n flipper set image deployment/dmd-deployment dmd=$DMD_IMAGE || true
          kubectl apply -k k8s
