name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Préparation (détection backend/frontend)
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.check.outputs.has_backend }}
      has_frontend: ${{ steps.check.outputs.has_frontend }}
      has_yarn: ${{ steps.check.outputs.has_yarn }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier la présence des fichiers nécessaires
        id: check
        shell: bash
        run: |
          # Backend Go : on considère prêt si go.mod existe
          if [ -f "backend/go.mod" ]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

          # Frontend : on considère prêt si package.json (racine) et index.html existent
          if [ -f "package.json" ] && [ -f "frontend/index.html" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # Détection Yarn (optionnel) : si yarn.lock existe, on utilisera yarn
          if [ -f "yarn.lock" ]; then
            echo "has_yarn=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_yarn=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend (Go) — build + tests
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.has_backend == 'true' }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      # Important pour votre projet (goroutines, WebSocket, MQTT) : race detector
      - name: Tests (race + coverage)
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1

      # (Optionnel) Upload du rapport de coverage comme artefact
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

      - name: Vet
        run: go vet ./...

  iot-mqtt-smoke:
    name: IoT — smoke MQTT (broker Docker + scripts Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Démarrer Mosquitto
        run: docker compose -f iot/docker-compose.yml up -d

      - name: Attendre le broker
        run: |
          for i in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/1883' 2>/dev/null; then
              echo "Broker prêt"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout broker"
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iot/scripts/requirements.txt

      - name: Dépendances scripts IoT
        run: pip install -r iot/scripts/requirements.txt

      - name: Tests scripts MQTT
        run: |
          python iot/scripts/publish_hello.py
          python iot/scripts/publish_solenoid_sample.py
          python iot/scripts/fake_esp32_publisher.py --cycles 2 --interval 0.3
          python iot/scripts/monitor_sys.py --seconds 2
          python iot/scripts/stability_run.py --duration 5 --rate 25 --qos 1
          python iot/scripts/qos_benchmark.py --count 80

      - name: Logs Mosquitto (diagnostic)
        if: failure()
        run: docker compose -f iot/docker-compose.yml logs

      - name: Arrêt Mosquitto
        if: always()
        run: docker compose -f iot/docker-compose.yml down -v

  frontend:
    name: Frontend — install + lint + test + build
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.has_frontend == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Si Yarn est détecté, on utilise Yarn ; sinon NPM
      - name: Install (Yarn)
        if: ${{ needs.prepare.outputs.has_yarn == 'true' }}
        run: yarn install --frozen-lockfile

      - name: Install (NPM)
        if: ${{ needs.prepare.outputs.has_yarn != 'true' }}
        run: npm ci

      - name: Lint (si présent)
        run: npm run lint --if-present

      # Si vous ajoutez Vitest/Jest, ce step s'activera automatiquement
      - name: Tests (si présent)
        run: npm run test --if-present

      - name: Build (si présent)
        run: npm run build --if-present
