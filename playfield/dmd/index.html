<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <title>DMD</title>

    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        overflow: hidden;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
          radial-gradient(
            circle at center,
            rgba(255, 255, 120, 0.08) 0%,
            rgba(0, 0, 0, 0) 45%
          ),
          linear-gradient(180deg, #05070c 0%, #000 100%);
      }

      #score {
        --dmd-color: rgb(4, 190, 200);
        --dmd-glow: rgba(4, 190, 200, 0.85);
        position: fixed;
        inset: 2.5vh 2.5vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4vh;
        width: 95vw;
        height: 95vh;
        overflow: hidden;
        padding: 1vh 1vw;
        color: var(--dmd-color);
        font-family: "Press Start 2P", monospace;
        font-weight: 400;
        line-height: 1.1;
        letter-spacing: 0;
        text-transform: uppercase;
        white-space: nowrap;
        text-align: center;
        -webkit-font-smoothing: none;
        text-rendering: geometricPrecision;
        image-rendering: pixelated;
        text-shadow:
          4px 0 #000,
          -4px 0 #000,
          0 4px #000,
          0 -4px #000,
          6px 6px rgba(0, 0, 0, 0.95),
          0 0 10px var(--dmd-glow),
          0 0 22px var(--dmd-glow),
          0 0 42px var(--dmd-glow);
        user-select: none;
        pointer-events: none;
      }

      .dmd-title {
        font-size: 15vh;
        color: rgb(255, 220, 90);
      }

      .dmd-main {
        font-size: 50vh;
      }

      .dmd-sub {
        font-size: 12vh;
      }

      .dmd-points .dmd-main,
      .dmd-combo .dmd-main,
      .dmd-super-combo .dmd-main {
        animation: dmd-pulse 0.38s steps(2, end) infinite;
      }

      #score.dmd-multiplier-2 {
        --dmd-color: rgb(70, 255, 130);
        --dmd-glow: rgba(70, 255, 130, 0.85);
      }

      #score.dmd-multiplier-3 {
        --dmd-color: rgb(255, 145, 45);
        --dmd-glow: rgba(255, 145, 45, 0.85);
      }

      #score.dmd-multiplier-4 {
        --dmd-color: rgb(255, 45, 45);
        --dmd-glow: rgba(255, 45, 45, 0.85);
      }

      .dmd-super-combo {
        animation: dmd-shake 0.16s steps(2, end) infinite;
      }

      .dmd-super-combo .dmd-title {
        color: rgb(255, 240, 90);
      }

      @keyframes dmd-pulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.08); }
      }

      @keyframes dmd-shake {
        0% { transform: translateX(-0.7vw); }
        100% { transform: translateX(0.7vw); }
      }
      /* Scanlines CRT */
      body::after {
        content: "";
        position: fixed;
        inset: 0;

        background:
          repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.045) 0px,
            rgba(255,255,255,0.045) 2px,
            transparent 2px,
            transparent 4px
          );

        opacity: 0.4;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="score"></div>

    <script type="module">
      import { DmdDisplay } from './DmdDisplay.js?v=5';

      new DmdDisplay();
    </script>
  </body>
</html>
