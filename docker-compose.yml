services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: flipper-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./iot/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # dev + volume ./backend:/app => Air compile tmp/main (hot reload)
      # production + ce volume => /app/server disparaît => erreur au démarrage
      args:
        ENV: ${ENV:-dev}
    container_name: flipper-backend
    ports:
      - "8080:8080"
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    volumes:
      - backend-cache:/go/pkg/mod
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    restart: unless-stopped

  frontend_flipper:
    build:
      context: ./frontend/flipper
      dockerfile: Dockerfile
    container_name: frontend-flipper
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ./frontend/flipper:/usr/share/nginx/html
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend_backglass:
    build:
      context: ./frontend/backglass
      dockerfile: Dockerfile
    container_name: frontend-backglass
    ports:
      - "${BACKGLASS_PORT:-3002}:80"
    volumes:
      - ./frontend/backglass:/usr/share/nginx/html
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend_dmd:
    build:
      context: ./frontend/dmd
      dockerfile: Dockerfile
    container_name: frontend-dmd
    ports:
      - "${DMD_PORT:-3003}:80"
    volumes:
      - ./frontend/dmd:/usr/share/nginx/html
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend_kiosk:
    build:
      context: ./frontend/kiosk
      dockerfile: Dockerfile
    container_name: frontend-kiosk
    ports:
      - "${KIOSK_PORT:-32789}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend_flipper:
        condition: service_started
      frontend_backglass:
        condition: service_started
      frontend_dmd:
        condition: service_started
    restart: unless-stopped

volumes:
  mosquitto-data:
  backend-cache:
