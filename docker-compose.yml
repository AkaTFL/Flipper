services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: flipper-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./iot/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flipper-backend
    ports:
      - "8080:8080"
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend_flipper:
    build:
      context: ./frontend/flipper
      dockerfile: Dockerfile
    container_name: frontend-flipper
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend_backglass:
    build:
      context: ./frontend/backglass
      dockerfile: Dockerfile
    container_name: frontend-backglass
    ports:
      - "${DMD_PORT:-3002}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend_dmd:
    build:
      context: ./frontend/dmd
      dockerfile: Dockerfile
    container_name: frontend-dmd
    ports:
      - "${DMD_PORT:-3003}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto-data:
