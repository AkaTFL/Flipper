services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flipper-backend
    ports:
      - "8080:8080"
    environment:
      MQTT_HOST: host.docker.internal
      MQTT_PORT: "1883"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/flipper
      dockerfile: Dockerfile
    container_name: flipper-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
